name: Build and Create Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Check documentation, JSON and localization
        run: python3 scripts/check_project.py
      - name: Build and test all Minecraft versions
        run: ./gradlew ':1.21.11:build' ':26.1.2:build' ':26.2:build' ':26.3:build'
      - name: Collect release jars
        shell: bash
        run: |
          mkdir -p release_jars
          version=$(sed -n 's/^mod.version = "\([^"]*\)"/\1/p' stonecutter.properties.toml)
          for mc in 1.21.11 26.1.2 26.2 26.3; do
            cp "versions/$mc/build/libs/skyblock_translator-$version+mc$mc.jar" release_jars/
          done
          (cd release_jars && sha256sum *.jar > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: release-jars
          path: release_jars/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: versions/*/build/reports/tests/

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: release-jars
          path: release_jars
      - name: Verify tag matches mod version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^mod.version = "\([^"]*\)"/\1/p' stonecutter.properties.toml)
          test "$RELEASE_TAG" = "v$version"
          test -f "release-notes/$RELEASE_TAG.md"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release_jars/* --clobber
            gh release edit "$RELEASE_TAG" --notes-file "release-notes/$RELEASE_TAG.md"
          else
            gh release create "$RELEASE_TAG" release_jars/* --verify-tag --title "SkyBlock Translator $RELEASE_TAG" --notes-file "release-notes/$RELEASE_TAG.md"
          fi

  modrinth-description:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: github-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Synchronize Modrinth description and documentation links
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: python3 scripts/sync_modrinth.py

  modrinth:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: modrinth-description
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['1.21.11', '26.1.2', '26.2', '26.3']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: release-jars
          path: release_jars
      - name: Publish matching Minecraft jar to Modrinth
        uses: kir-antipov/mc-publish@v3.3
        with:
          modrinth-id: skyblock-translator
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-version: ${{ github.ref_name }}+mc${{ matrix.minecraft }}
          files: release_jars/*+mc${{ matrix.minecraft }}.jar
          name: SkyBlock Translator ${{ github.ref_name }} (Minecraft ${{ matrix.minecraft }})
          changelog-file: release-notes/${{ github.ref_name }}.md
          loaders: fabric
          game-versions: ${{ matrix.minecraft }}
