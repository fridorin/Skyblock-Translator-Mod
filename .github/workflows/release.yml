name: Build and Create Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Java 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build All Minecraft Versions
        run: ./gradlew ":1.21.11:build" ":26.1.2:build" ":26.2:build" ":26.3:build"

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release_jars
          find versions -type f -path "*/build/libs/*.jar" ! -name "*-sources.jar" ! -name "*-dev.jar" -exec cp {} release_jars/ \;
          echo "Collected release JARS:"
          ls -la release_jars/
          count=$(find release_jars -type f -name '*.jar' | wc -l)
          if [ "$count" -ne 4 ]; then
            echo "Error: Expected 4 release jars, found $count"
            exit 1
          fi

      - name: Publish to Modrinth and GitHub
        uses: kir-antipov/mc-publish@v3.3
        with:
          modrinth-id: skyblock-translator
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ github.ref_name }}
          files: release_jars/*.jar
          name: SkyBlock Translator ${{ github.ref_name }}
          loaders: fabric
          game-versions: 1.21.11, 26.1.2, 26.2, 26.3
