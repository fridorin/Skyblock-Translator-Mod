name: Build and Create Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      minecraft: ${{ steps.variants.outputs.minecraft }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: chmod +x gradlew
      - name: Check documentation, JSON and localization
        run: python3 scripts/check_project.py
      - name: Read Minecraft variants
        id: variants
        run: |
          variants=$(python3 scripts/check_jars.py --matrix)
          printf 'minecraft=%s\n' "$variants" >> "$GITHUB_OUTPUT"
      - name: Build and test all Minecraft versions
        shell: bash
        env:
          MINECRAFT_VARIANTS: ${{ steps.variants.outputs.minecraft }}
        run: |
          tasks=$(jq -er '.[] | ":\(.build):build"' <<< "$MINECRAFT_VARIANTS")
          mapfile -t build_tasks <<< "$tasks"
          ./gradlew "${build_tasks[@]}"
      - name: Verify and collect release jars
        run: python3 scripts/check_jars.py --collect release_jars
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-jars
          path: release_jars/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-reports
          path: versions/*/build/reports/tests/

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-jars
          path: release_jars
      - name: Verify release checksums
        run: cd release_jars && sha256sum --strict --check SHA256SUMS.txt
      - name: Verify tag matches mod version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^mod.version = "\([^"]*\)"/\1/p' stonecutter.properties.toml)
          test "$RELEASE_TAG" = "v$version"
          test -f "release-notes/$RELEASE_TAG.md"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release_jars/* --clobber
            gh release edit "$RELEASE_TAG" --notes-file "release-notes/$RELEASE_TAG.md"
          else
            gh release create "$RELEASE_TAG" release_jars/* --verify-tag --title "SkyBlock Translator $RELEASE_TAG" --notes-file "release-notes/$RELEASE_TAG.md"
          fi

  modrinth:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, github-release]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.build.outputs.minecraft) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-jars
          path: release_jars
      - name: Verify release checksums
        run: cd release_jars && sha256sum --strict --check SHA256SUMS.txt
      - name: Publish matching Minecraft jar to Modrinth
        uses: kir-antipov/mc-publish@c23376546a97f5ba7984e94445da359459b14419 # v3.3.2
        with:
          modrinth-id: IryQN0Fj
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-version: ${{ github.ref_name }}+mc${{ matrix.build }}
          files: release_jars/*+mc${{ matrix.build }}.jar
          name: SkyBlock Translator ${{ github.ref_name }} (Minecraft ${{ matrix.build }})
          changelog-file: release-notes/${{ github.ref_name }}.md
          version-type: release
          loaders: fabric
          game-versions: ${{ matrix.releases }}
          game-version-filter: releases
          modrinth-dependencies: |
            P7dR8mSH(required)
            1eAoo2KR(required)

  modrinth-description:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: modrinth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Synchronize Modrinth description and documentation links
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: python3 scripts/sync_modrinth.py
